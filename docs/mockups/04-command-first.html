<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>04 · Command-first</title><link rel="stylesheet" href="base.css">
<style>
  .stage { position:relative; height:100%; }
  .canvas { position:absolute; inset:0; border-radius:0; }
  .topbar { position:absolute; top:0; left:0; right:0; height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:4; }
  /* minimal floating toolbar, bottom center */
  .toolbar { position:absolute; bottom:26px; left:50%; transform:translateX(-50%); z-index:4;
    display:flex; align-items:center; gap:4px; padding:7px; border-radius:16px;
    background:var(--card-glass); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.07); box-shadow:var(--shadow-float); }
  .tb { width:40px; height:40px; border-radius:11px; display:grid; place-items:center; color:var(--ink-soft); cursor:pointer; font-size:15px; }
  .tb.on { background:var(--ink); color:var(--paper); }
  .tb.k { width:auto; padding:0 14px; gap:8px; font-family:var(--mono); font-size:11px; color:var(--ink-soft); }
  .kbd { font-family:var(--mono); font-size:10px; border:1px solid var(--line); border-radius:5px; padding:1px 5px; }
  /* command palette overlay */
  .scrim { position:absolute; inset:0; background:rgba(0,0,0,.34); z-index:8; display:grid; place-items:start center; padding-top:14vh; }
  .palette { width:min(560px,86vw); background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-float); overflow:hidden; }
  .palette .q { display:flex; align-items:center; gap:11px; padding:16px 18px; border-bottom:1px solid var(--line-soft); }
  .palette .q input { all:unset; flex:1; font-family:var(--sans); font-size:16px; color:var(--ink); }
  .palette .q .cur { width:2px; height:18px; background:var(--accent); animation:blink 1.1s steps(1) infinite; }
  @keyframes blink { 50%{opacity:0} }
  .opt { display:flex; align-items:center; gap:12px; padding:11px 18px; cursor:pointer; }
  .opt.sel { background:var(--paper-2); }
  .opt .ico { width:26px; height:26px; border-radius:7px; display:grid; place-items:center; background:var(--paper-2); color:var(--ink-soft); font-size:13px; }
  .opt.sel .ico { background:var(--accent); color:#fff; }
  .opt .t { font-size:13.5px; } .opt .s { font-family:var(--mono); font-size:10px; color:var(--ink-faint); margin-left:auto; }
</style></head>
<body class="grain theme-dark"><div class="stage">
  <div class="canvas dark"></div>
  <div class="topbar"><div class="brand"><span class="mark"></span><h1>Halftone Studio</h1></div>
    <div style="display:flex;gap:8px"><span class="pill accent">Export</span></div></div>

  <div class="toolbar">
    <div class="tb on">◉</div><div class="tb">◧</div><div class="tb">◑</div><div class="tb">▦</div>
    <div style="width:1px;height:24px;background:var(--line);margin:0 3px"></div>
    <div class="tb k">Search <span class="kbd">⌘K</span></div>
  </div>

  <div class="scrim">
    <div class="palette">
      <div class="q"><span style="color:var(--ink-faint)">⌘</span><input value="contrast" readonly><span class="cur"></span></div>
      <div class="opt sel"><span class="ico">◑</span><span class="t">Tone · Contrast</span><span class="s">slider</span></div>
      <div class="opt"><span class="ico">◉</span><span class="t">Mode · Halftone screen</span><span class="s">jump</span></div>
      <div class="opt"><span class="ico">▦</span><span class="t">Texture · Crackle glaze</span><span class="s">apply</span></div>
      <div class="opt"><span class="ico">✦</span><span class="t">Preset · Comic ink</span><span class="s">apply</span></div>
      <div class="opt"><span class="ico">⇪</span><span class="t">Import palette from image…</span><span class="s">action</span></div>
    </div>
  </div>
</div></body></html>
